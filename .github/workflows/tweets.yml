name: Fetch Tweets (Nitter)

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tweets-nitter
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch tweets from Nitter
        env:
          TWEET_SCREEN_NAME: glorysdj
          TWEET_MAX: "20"
        run: python scripts/fetch_tweets_nitter.py

      - name: Commit tweets.json
        run: |
          git config user.name "glorysdj-tweets-bot"
          git config user.email "tweets-bot@users.noreply.github.com"
          git add tweets.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update tweets.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
