<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="glorysdj — Software Developer, Intel PE">
  <title>glorysdj · Software Developer</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-2: #3fb950;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16202c 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: #0d1117;
      flex-shrink: 0;
    }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .tagline { color: var(--accent); font-size: 16px; margin-top: 4px; }
    .section { margin-top: 28px; }
    .section h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text-muted); margin-bottom: 12px;
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    .bio { color: var(--text); font-size: 15px; }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill {
      background: rgba(88,166,255,0.1);
      border: 1px solid rgba(88,166,255,0.3);
      color: var(--accent);
      padding: 5px 12px; border-radius: 999px; font-size: 13px;
    }
    .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text); text-decoration: none;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 16px; font-size: 14px;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .link:hover { border-color: var(--accent); background: rgba(88,166,255,0.08); transform: translateY(-2px); }
    .link svg { width: 18px; height: 18px; fill: currentColor; }
    .footer { margin-top: 36px; text-align: center; color: var(--text-muted); font-size: 12px; }
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      .header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
